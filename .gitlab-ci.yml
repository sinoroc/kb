---


pre-commit:
  image: python:3.14
  before_script:
    - python -m pip install pre-commit
  script:
    - pre-commit run --all-files --show-diff-on-failure


pylint:
  image: python:3.14-trixie
  before_script:
    - apt-get --assume-yes --quiet update
    - >
      apt-get --assume-yes --quiet install --no-install-recommends
      libenchant-2-2
    - python -m pip install 'pylint[spelling]' pylint-gitlab
  script:
    - >
      pylint
      --output-format=pylint_gitlab.GitlabCodeClimateReporter:pylint.json,colorized
      '**/*.py'
  artifacts:
    reports:
      codequality: pylint.json


.build:
  image: python:3.14-trixie
  before_script:
    - apt-get --assume-yes --quiet update
    - >
      apt-get --assume-yes --quiet install --no-install-recommends
      graphviz
      latexmk
      tex-gyre
      texlive-fonts-recommended
      texlive-latex-extra
      texlive-latex-recommended
    - pip install tox
  script:
    - tox run -e build
    - cp -r build/html public


build:
  extends: .build


pages:
  extends: .build
  artifacts:
    paths:
      - public
  only:
    - main


...  # EOF
